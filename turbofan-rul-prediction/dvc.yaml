stages:
  prepare:
    cmd: python -m src.data.prepare
    deps:
      - src/data/prepare.py
      - src/core/settings.py
      - data/processed/train.parquet
      - data/processed/test.parquet

  build_features:
    cmd: python -m src.features.build_features
    deps:
      - src/features/build_features.py
      - src/core/settings.py
      - data/processed/train.parquet
      - data/processed/test.parquet
    outs:
      - src/data/processed/train_features.parquet
      - src/data/processed/test_features.parquet

  train:
    cmd: python -m src.training.train
    deps:
      - src/training/train.py
      - src/training/evaluate.py
      - src/core/settings.py
      - configs/config.yaml
      - configs/model/random_forest.yaml
      - configs/training/default.yaml
      - src/data/processed/train_features.parquet
      - src/data/processed/test_features.parquet
    outs:
      - artifacts/model/model.joblib

  predict:
    cmd: python -m src.inference.predict
    deps:
      - src/inference/predict.py
      - src/core/settings.py
      - artifacts/model/model.joblib
      - src/data/processed/test_features.parquet
    outs:
      - artifacts/model/predictions.parquet