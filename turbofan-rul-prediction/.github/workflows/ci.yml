name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check raw data folder
        run: |
          mkdir -p data/raw
          echo "CI ready"

      - name: Smoke test imports
        run: |
          python -c "import src"
          python -c "from src.core.settings import ROOT_DIR; print(ROOT_DIR)"